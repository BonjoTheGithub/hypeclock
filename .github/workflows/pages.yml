name: Refresh FreeToGame cache

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh FreeToGame cache
        run: node scripts/update-games.cjs

      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- games.json; then
            echo "No cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Refresh FreeToGame cache [skip ci]"
          git push
