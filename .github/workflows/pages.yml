name: Refresh FreeToGame cache

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: freetogame-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh FreeToGame cache
        run: node scripts/update-games.cjs

      - name: Commit refreshed cache safely
        shell: bash
        run: |
          set -e

          if git diff --quiet -- games.json; then
            echo "No cache changes"
            exit 0
          fi

          # Preserve the newly generated cache, then sync to the newest main.
          cp games.json /tmp/hypeclock-games.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry if someone edits the website while this job is running.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hypeclock-games.json games.json

            if git diff --quiet -- games.json; then
              echo "Remote already has the same cache"
              exit 0
            fi

            git add games.json
            git commit -m "Refresh FreeToGame cache [skip ci]"

            if git push origin HEAD:main; then
              echo "FreeToGame cache pushed successfully"
              exit 0
            fi

            echo "Remote changed while refreshing; syncing and retrying..."
            sleep 2
          done

          echo "Could not push cache after 3 attempts"
          exit 1
